name: Build Mouse APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Mouse.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mouse-apk
          path: Mouse.apk
